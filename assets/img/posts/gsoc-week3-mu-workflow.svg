<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3440 920" width="100%" height="100%" style="background-color: #121212; font-family: system-ui, -apple-system, sans-serif;">
  <defs>
    <!-- Box Gradients -->
    <linearGradient id="route-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e1e" />
      <stop offset="100%" stop-color="#181818" />
    </linearGradient>
    <linearGradient id="test-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d2d2d" />
      <stop offset="100%" stop-color="#222222" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <!-- Marker for arrows -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#888888" />
    </marker>
    <marker id="orange-arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#f59e0b" />
    </marker>
  </defs>

  <!-- ==================== TOP LAYER: ROUTE ENDPOINTS ==================== -->
  <!-- R1: /dashboard/patients/{patient} -->
  <g transform="translate(50, 100)" filter="url(#shadow)">
    <rect width="260" height="50" rx="8" fill="url(#route-grad)" stroke="#ffffff" stroke-width="1.2" />
    <text x="130" y="30" fill="#ffffff" font-size="12" font-family="monospace" text-anchor="middle">/dashboard/patients/{patient}</text>
  </g>

  <!-- R2: /dashboard/patients/load/data -->
  <g transform="translate(330, 100)" filter="url(#shadow)">
    <rect width="260" height="50" rx="8" fill="url(#route-grad)" stroke="#ffffff" stroke-width="1.2" />
    <text x="130" y="30" fill="#ffffff" font-size="12" font-family="monospace" text-anchor="middle">/dashboard/patients/load/data</text>
  </g>

  <!-- R3: /dashboard/patients/select/{pid} -->
  <g transform="translate(610, 100)" filter="url(#shadow)">
    <rect width="260" height="50" rx="8" fill="url(#route-grad)" stroke="#ffffff" stroke-width="1.2" />
    <text x="130" y="30" fill="#ffffff" font-size="12" font-family="monospace" text-anchor="middle">/dashboard/patients/select/{pid}</text>
  </g>

  <!-- R4: /login & /logout -->
  <g transform="translate(890, 100)" filter="url(#shadow)">
    <rect width="260" height="50" rx="8" fill="url(#route-grad)" stroke="#ffffff" stroke-width="1.2" />
    <text x="130" y="30" fill="#ffffff" font-size="13" font-family="monospace" text-anchor="middle">/login &amp; /logout</text>
  </g>

  <!-- R5: /dashboard -->
  <g transform="translate(1170, 100)" filter="url(#shadow)">
    <rect width="260" height="50" rx="8" fill="url(#route-grad)" stroke="#ffffff" stroke-width="1.2" />
    <text x="130" y="30" fill="#ffffff" font-size="14" font-family="monospace" text-anchor="middle">/dashboard</text>
  </g>

  <!-- R6: /secure.portal/admin -->
  <g transform="translate(1450, 100)" filter="url(#shadow)">
    <rect width="260" height="50" rx="8" fill="url(#route-grad)" stroke="#ffffff" stroke-width="1.2" />
    <text x="130" y="30" fill="#ffffff" font-size="13" font-family="monospace" text-anchor="middle">/secure.portal/admin</text>
  </g>

  <!-- R7: /dashboard/users -->
  <g transform="translate(1730, 100)" filter="url(#shadow)">
    <rect width="260" height="50" rx="8" fill="url(#route-grad)" stroke="#ffffff" stroke-width="1.2" />
    <text x="130" y="30" fill="#ffffff" font-size="13" font-family="monospace" text-anchor="middle">/dashboard/users</text>
  </g>

  <!-- R8: /dashboard/prescriptions -->
  <g transform="translate(2010, 100)" filter="url(#shadow)">
    <rect width="260" height="50" rx="8" fill="url(#route-grad)" stroke="#ffffff" stroke-width="1.2" />
    <text x="130" y="30" fill="#ffffff" font-size="13" font-family="monospace" text-anchor="middle">/dashboard/prescriptions</text>
  </g>

  <!-- R9: /dashboard/cds-alerts -->
  <g transform="translate(2290, 100)" filter="url(#shadow)">
    <rect width="260" height="50" rx="8" fill="url(#route-grad)" stroke="#ffffff" stroke-width="1.2" />
    <text x="130" y="30" fill="#ffffff" font-size="13" font-family="monospace" text-anchor="middle">/dashboard/cds-alerts</text>
  </g>

  <!-- R10: /dashboard/patients/{pid}/appointments -->
  <g transform="translate(2570, 100)" filter="url(#shadow)">
    <rect width="260" height="50" rx="8" fill="url(#route-grad)" stroke="#ffffff" stroke-width="1.2" />
    <text x="130" y="30" fill="#ffffff" font-size="11.5" font-family="monospace" text-anchor="middle">/dashboard/patients/{pid}/appointments</text>
  </g>

  <!-- R11: /dashboard/facilities -->
  <g transform="translate(2850, 100)" filter="url(#shadow)">
    <rect width="260" height="50" rx="8" fill="url(#route-grad)" stroke="#ffffff" stroke-width="1.2" />
    <text x="130" y="30" fill="#ffffff" font-size="13" font-family="monospace" text-anchor="middle">/dashboard/facilities</text>
  </g>

  <!-- R12: /dashboard/patients/{pid}/reports -->
  <g transform="translate(3130, 100)" filter="url(#shadow)">
    <rect width="260" height="50" rx="8" fill="url(#route-grad)" stroke="#ffffff" stroke-width="1.2" />
    <text x="130" y="30" fill="#ffffff" font-size="11.5" font-family="monospace" text-anchor="middle">/dashboard/patients/{pid}/reports</text>
  </g>

  <!-- Unimplemented annotations -->
  <g font-size="13" fill="#f59e0b">
    <!-- Unimplemented above prescriptions/cds-alerts -->
    <text x="2280" y="35" text-anchor="middle" font-weight="bold">Unimplemented {Model create route yet to implement}</text>
    <path d="M 2140 85 L 2250 45" fill="none" stroke="#f59e0b" stroke-width="1.2" marker-end="url(#orange-arrow)" />
    <path d="M 2420 85 L 2310 45" fill="none" stroke="#f59e0b" stroke-width="1.2" marker-end="url(#orange-arrow)" />

    <!-- Unimplemented above reports -->
    <text x="3260" y="35" text-anchor="middle" font-weight="bold">Unimplemented {Model create route yet to implement}</text>
    <path d="M 3260 85 L 3260 50" fill="none" stroke="#f59e0b" stroke-width="1.2" marker-end="url(#orange-arrow)" />
  </g>


  <!-- ==================== MIDDLE LAYER: SECURITY TEST CONTAINER ==================== -->
  <text x="1720" y="225" fill="#ffffff" font-size="18" font-weight="bold" text-anchor="middle" opacity="0.8">Security test</text>
  <rect x="20" y="240" width="3400" height="150" rx="10" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="1,2" opacity="0.5" />

  <!-- S1: PatientAccessSecurityTest -->
  <g transform="translate(50, 290)" filter="url(#shadow)">
    <rect width="260" height="55" rx="4" fill="url(#test-grad)" stroke="#ffffff" stroke-width="1" />
    <text x="130" y="32" fill="#ffffff" font-size="12" font-family="monospace" text-anchor="middle">PatientAccessSecurityTest</text>
  </g>

  <!-- S2: PatientDataTableSecurityTest -->
  <g transform="translate(330, 290)" filter="url(#shadow)">
    <rect width="260" height="55" rx="4" fill="url(#test-grad)" stroke="#ffffff" stroke-width="1" />
    <text x="130" y="32" fill="#ffffff" font-size="12" font-family="monospace" text-anchor="middle">PatientDataTableSecurityTest</text>
  </g>

  <!-- S3: PatientSelectionSecurityTest -->
  <g transform="translate(610, 290)" filter="url(#shadow)">
    <rect width="260" height="55" rx="4" fill="url(#test-grad)" stroke="#ffffff" stroke-width="1" />
    <text x="130" y="32" fill="#ffffff" font-size="12" font-family="monospace" text-anchor="middle">PatientSelectionSecurityTest</text>
  </g>

  <!-- S4: AuthSecurityTest -->
  <g transform="translate(890, 290)" filter="url(#shadow)">
    <rect width="260" height="55" rx="4" fill="url(#test-grad)" stroke="#ffffff" stroke-width="1" />
    <text x="130" y="32" fill="#ffffff" font-size="13" font-family="monospace" text-anchor="middle">AuthSecurityTest</text>
  </g>

  <!-- S5: DashboardAccessSecurityTest -->
  <g transform="translate(1170, 290)" filter="url(#shadow)">
    <rect width="260" height="55" rx="4" fill="url(#test-grad)" stroke="#ffffff" stroke-width="1" />
    <text x="130" y="32" fill="#ffffff" font-size="12.5" font-family="monospace" text-anchor="middle">DashboardAccessSecurityTest</text>
  </g>

  <!-- S6: AdminAccessSecurityTest -->
  <g transform="translate(1450, 290)" filter="url(#shadow)">
    <rect width="260" height="55" rx="4" fill="url(#test-grad)" stroke="#ffffff" stroke-width="1" />
    <text x="130" y="32" fill="#ffffff" font-size="12.5" font-family="monospace" text-anchor="middle">AdminAccessSecurityTest</text>
  </g>

  <!-- S7: UserManagementSecurityTest -->
  <g transform="translate(1730, 290)" filter="url(#shadow)">
    <rect width="260" height="55" rx="4" fill="url(#test-grad)" stroke="#ffffff" stroke-width="1" />
    <text x="130" y="32" fill="#ffffff" font-size="12.5" font-family="monospace" text-anchor="middle">UserManagementSecurityTest</text>
  </g>

  <!-- S8: ClinicalWorkflowSecurityTest -->
  <g transform="translate(2010, 290)" filter="url(#shadow)">
    <rect width="540" height="55" rx="4" fill="url(#test-grad)" stroke="#ffffff" stroke-width="1" />
    <text x="270" y="32" fill="#ffffff" font-size="14" font-family="monospace" text-anchor="middle">ClinicalWorkflowSecurityTest</text>
  </g>

  <!-- S9: CalendarAppointmentSecurityTest -->
  <g transform="translate(2570, 290)" filter="url(#shadow)">
    <rect width="260" height="55" rx="4" fill="url(#test-grad)" stroke="#ffffff" stroke-width="1" />
    <text x="130" y="32" fill="#ffffff" font-size="12" font-family="monospace" text-anchor="middle">CalendarAppointmentSecurityTest</text>
  </g>

  <!-- S10: FacilitySecurityTest -->
  <g transform="translate(2850, 290)" filter="url(#shadow)">
    <rect width="260" height="55" rx="4" fill="url(#test-grad)" stroke="#ffffff" stroke-width="1" />
    <text x="130" y="32" fill="#ffffff" font-size="13" font-family="monospace" text-anchor="middle">FacilitySecurityTest</text>
  </g>

  <!-- S11: AuditLogSecurityTest -->
  <g transform="translate(3130, 290)" filter="url(#shadow)">
    <rect width="260" height="55" rx="4" fill="url(#test-grad)" stroke="#ffffff" stroke-width="1" />
    <text x="130" y="32" fill="#ffffff" font-size="13" font-family="monospace" text-anchor="middle">AuditLogSecurityTest</text>
  </g>


  <!-- ==================== BOTTOM LAYER: ACTUAL MEANINGFUL USE TEST SUITES ==================== -->
  <rect x="20" y="540" width="3400" height="180" rx="10" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="1,2" opacity="0.5" />

  <!-- MU1: PatientRegistrationSecurityTest -->
  <g transform="translate(50, 590)" filter="url(#shadow)">
    <rect width="540" height="85" rx="6" fill="url(#test-grad)" stroke="#ffffff" stroke-width="1.2" />
    <text x="270" y="33" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">MU1:</text>
    <text x="270" y="55" fill="#ffffff" font-size="14" font-family="monospace" text-anchor="middle">PatientRegistrationSecurityTest</text>
  </g>

  <!-- MU2: ClinicalDataExchangeSecurityTest -->
  <g transform="translate(610, 590)" filter="url(#shadow)">
    <rect width="260" height="85" rx="6" fill="url(#test-grad)" stroke="#ffffff" stroke-width="1.2" />
    <text x="130" y="33" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">MU2:</text>
    <text x="130" y="55" fill="#ffffff" font-size="11" font-family="monospace" text-anchor="middle">ClinicalDataExchangeSecurityTest</text>
  </g>

  <!-- MU3: PrivacySecurityTest -->
  <g transform="translate(890, 590)" filter="url(#shadow)">
    <rect width="1100" height="85" rx="6" fill="url(#test-grad)" stroke="#ffffff" stroke-width="1.5" />
    <text x="550" y="49" fill="#ffffff" font-size="18" font-family="monospace" text-anchor="middle">MU3: PrivacySecurityTest</text>
  </g>

  <!-- MU4: EPrescribingSecurityTest -->
  <g transform="translate(2010, 590)" filter="url(#shadow)">
    <rect width="260" height="85" rx="6" fill="url(#test-grad)" stroke="#ffffff" stroke-width="1.2" />
    <text x="130" y="33" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">MU4:</text>
    <text x="130" y="55" fill="#ffffff" font-size="13" font-family="monospace" text-anchor="middle">EPrescribingSecurityTest</text>
  </g>

  <!-- MU5: ClinicalDecisionSupportSecurityTest -->
  <g transform="translate(2290, 590)" filter="url(#shadow)">
    <rect width="540" height="85" rx="6" fill="url(#test-grad)" stroke="#ffffff" stroke-width="1.2" />
    <text x="270" y="33" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">MU5:</text>
    <text x="270" y="55" fill="#ffffff" font-size="13.5" font-family="monospace" text-anchor="middle">ClinicalDecisionSupportSecurityTest</text>
  </g>

  <!-- MU6: ReportingSecurityTest -->
  <g transform="translate(2850, 590)" filter="url(#shadow)">
    <rect width="540" height="85" rx="6" fill="url(#test-grad)" stroke="#ffffff" stroke-width="1.2" />
    <text x="270" y="33" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">MU6:</text>
    <text x="270" y="55" fill="#ffffff" font-size="14" font-family="monospace" text-anchor="middle">ReportingSecurityTest</text>
  </g>


  <!-- Actual Meaningful Use Label Card at the bottom -->
  <g transform="translate(1570, 780)" filter="url(#shadow)">
    <rect width="300" height="55" rx="8" fill="url(#test-grad)" stroke="#ffffff" stroke-width="1" opacity="0.9" />
    <text x="150" y="25" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">Actual Meaningful Use</text>
    <text x="150" y="41" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">Test Suites</text>
  </g>
  <path d="M 1720 780 L 1720 725" fill="none" stroke="#ffffff" stroke-width="1.2" marker-end="url(#arrow)" />


  <!-- ==================== CONNECTING PATHS & ARROWS ==================== -->
  <!-- Top layer -> Middle layer (Routes -> Security tests) -->
  <path d="M 180 150 L 180 285" fill="none" stroke="#ffffff" stroke-width="1.2" marker-end="url(#arrow)" />
  <path d="M 460 150 L 460 285" fill="none" stroke="#ffffff" stroke-width="1.2" marker-end="url(#arrow)" />
  <path d="M 740 150 L 740 285" fill="none" stroke="#ffffff" stroke-width="1.2" marker-end="url(#arrow)" />
  <path d="M 1020 150 L 1020 285" fill="none" stroke="#ffffff" stroke-width="1.2" marker-end="url(#arrow)" />
  <path d="M 1300 150 L 1300 285" fill="none" stroke="#ffffff" stroke-width="1.2" marker-end="url(#arrow)" />
  <path d="M 1580 150 L 1580 285" fill="none" stroke="#ffffff" stroke-width="1.2" marker-end="url(#arrow)" />
  <path d="M 1860 150 L 1860 285" fill="none" stroke="#ffffff" stroke-width="1.2" marker-end="url(#arrow)" />
  <path d="M 2140 150 L 2200 285" fill="none" stroke="#ffffff" stroke-width="1.2" marker-end="url(#arrow)" />
  <path d="M 2420 150 L 2360 285" fill="none" stroke="#ffffff" stroke-width="1.2" marker-end="url(#arrow)" />
  <path d="M 2700 150 L 2700 285" fill="none" stroke="#ffffff" stroke-width="1.2" marker-end="url(#arrow)" />
  <path d="M 2980 150 L 2980 285" fill="none" stroke="#ffffff" stroke-width="1.2" marker-end="url(#arrow)" />
  <path d="M 3260 150 L 3260 285" fill="none" stroke="#ffffff" stroke-width="1.2" marker-end="url(#arrow)" />

  <!-- Middle layer -> Bottom layer (Security tests -> MU Suites) -->
  <!-- PatientAccess (Col 1) -> MU1 -->
  <path d="M 180 345 L 180 585" fill="none" stroke="#ffffff" stroke-width="1.2" marker-end="url(#arrow)" />
  <!-- PatientDataTable (Col 2) -> MU1 -->
  <path d="M 460 345 L 410 585" fill="none" stroke="#ffffff" stroke-width="1.2" marker-end="url(#arrow)" />
  <!-- PatientSelection (Col 3) -> MU2 -->
  <path d="M 740 345 L 740 585" fill="none" stroke="#ffffff" stroke-width="1.2" marker-end="url(#arrow)" />
  <!-- Auth (Col 4) -> MU3 -->
  <path d="M 1020 345 L 1120 585" fill="none" stroke="#ffffff" stroke-width="1.2" marker-end="url(#arrow)" />
  <!-- DashboardAccess (Col 5) -> MU3 -->
  <path d="M 1300 345 L 1300 585" fill="none" stroke="#ffffff" stroke-width="1.2" marker-end="url(#arrow)" />
  <!-- AdminAccess (Col 6) -> MU3 -->
  <path d="M 1580 345 L 1480 585" fill="none" stroke="#ffffff" stroke-width="1.2" marker-end="url(#arrow)" />
  <!-- UserManagement (Col 7) -> MU3 -->
  <path d="M 1860 345 L 1760 585" fill="none" stroke="#ffffff" stroke-width="1.2" marker-end="url(#arrow)" />
  <!-- ClinicalWorkflow -> MU4 -->
  <path d="M 2200 345 L 2140 585" fill="none" stroke="#ffffff" stroke-width="1.2" marker-end="url(#arrow)" />
  <!-- ClinicalWorkflow -> MU5 -->
  <path d="M 2360 345 L 2420 585" fill="none" stroke="#ffffff" stroke-width="1.2" marker-end="url(#arrow)" />
  <!-- CalendarAppointment (Col 10) -> MU5 -->
  <path d="M 2700 345 L 2700 585" fill="none" stroke="#ffffff" stroke-width="1.2" marker-end="url(#arrow)" />
  <!-- Facility (Col 11) -> MU6 -->
  <path d="M 2980 345 L 2980 585" fill="none" stroke="#ffffff" stroke-width="1.2" marker-end="url(#arrow)" />
  <!-- AuditLog (Col 12) -> MU6 -->
  <path d="M 3260 345 L 3210 585" fill="none" stroke="#ffffff" stroke-width="1.2" marker-end="url(#arrow)" />

</svg>
