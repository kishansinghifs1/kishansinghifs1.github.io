<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">GSoC 2026 LibreHealth Final Report: Final Work Done</title>
  <desc id="desc">Abstract banner for the final GSoC 2026 LibreHealth summary of completed work</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="complete" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="980" cy="120" r="180" fill="#1d4ed8" opacity="0.18"/>
  <circle cx="180" cy="530" r="220" fill="#0891b2" opacity="0.18"/>
  <circle cx="1020" cy="500" r="110" fill="#0ea5e9" opacity="0.12"/>
  <rect x="90" y="90" width="1020" height="450" rx="28" fill="#0b1324" stroke="#334155" stroke-width="2"/>

  <text x="140" y="220" fill="#e2e8f0" font-size="66" font-family="Segoe UI, Arial, sans-serif" font-weight="700">
    GSoC 2026 LibreHealth
  </text>
  <text x="140" y="295" fill="url(#accent)" font-size="62" font-family="Segoe UI, Arial, sans-serif" font-weight="700">
    Final Report
  </text>
  <text x="140" y="360" fill="#94a3b8" font-size="36" font-family="Segoe UI, Arial, sans-serif" font-weight="500">
    Final Work Done
  </text>

  <rect x="140" y="410" width="420" height="10" rx="5" fill="#334155"/>
  <rect x="140" y="410" width="420" height="10" rx="5" fill="url(#complete)"/>

  <rect x="140" y="452" width="210" height="4" rx="2" fill="#1e293b"/>
  <rect x="360" y="452" width="110" height="4" rx="2" fill="#1e293b"/>
  <rect x="480" y="452" width="80" height="4" rx="2" fill="#1e293b"/>
</svg>
